<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM BePyME Asistente | Qlik AI</title>
    <link rel="stylesheet" href="styles/customAIChat.css">

    <!-- This script loads the Qlik Embed Web Components library-->
    <script crossorigin="anonymous" type="application/javascript"
        src="https://cdn.jsdelivr.net/npm/@qlik/embed-web-components@1/dist/index.min.js"
        data-host="https://dataiq-mexico.us.qlikcloud.com" data-client-id="7f319abbd9122edb0b11e5d0c1bd46e7"
        data-redirect-uri="http://127.0.0.1:5500/src/oauth_callback.html" data-access-token-storage="session"
        data-auto-redirect="true"></script>
</head>

<body>
    <header class="app-header">
        <div class="app-title">CRM BePyME Asistente</div>
        <div class="app-subtitle">Tu asistente inteligente de análisis de datos</div>
    </header>

    <main class="main-section">
        <!-- Left Embed Panel -->
        <article class="main-column">
            <div class="chat-container">
                <qlik-embed ui="ai/agentic-assistant" assistant-id="47461ad6-1685-4ed6-a00a-e0f6224b3b0d"
                    language="es"></qlik-embed>
            </div>
        </article>

        <!-- Right Custom Assistant Panel -->
        <article class="main-column">
            <div class="chat-container">
                <div class="chat-header">
                    <h4>Tu asistente</h4>
                    <span class="header-span">Pregunta, Qlik responde.</span>
                </div>

                <div class="chat-body" id="chat-body">
                    <div class="message assistant">
                        <div class="bubble">
                            <p>Hola, hablemos.</p>
                        </div>
                    </div>
                </div>
                <div class="chat-footer">
                    <input type="text" id="chat-input" placeholder="Haz tu pregunta aquí..." />
                    <button id="send-btn">Enviar</button>
                </div>
            </div>
        </article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="scripts/customAIChat.js"></script>
    <script src="https://dataiq-mexico.us.qlikcloud.com/resources/assets/external/requirejs/require.js"></script>
</body>

</html>
