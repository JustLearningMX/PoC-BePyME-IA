            crossorigin="anonymous"
            type="application/javascript"
            src="https://cdn.jsdelivr.net/npm/@qlik/embed-web-components@1/dist/index.min.js"
            data-host="https://dataiq-mexico.us.qlikcloud.com"
            data-client-id="7f319abbd9122edb0b11e5d0c1bd46e7"

<body>
<h1>CRM BePyME Asistente</h1>

<section
        style="
            display: flex;
            gap: 25px;
            width: 100%;
            background-color: #f0f0f0;
            padding: 20px;
            border: 1px solid darkolivegreen;
        "
>
    <article style="width: 45%; border: 1px solid cornflowerblue; ">
        <!--In this example, we will show how to use the Qlik AI Assistant component. -->
        <qlik-embed
                ui="ai/agentic-assistant"
                assistant-id="47461ad6-1685-4ed6-a00a-e0f6224b3b0d"
        ></qlik-embed>
    </article>

    <article style="width: 45%; border: 1px solid cornflowerblue; ">
        <!-- This example shows how to use the Qlik AI Assistant component with a Knowledgebases API and Assistants API to build a custom chat assistant.-->
        <div class="chat-container">
            <div class="chat-header">
                <h4>Tu asistente</h4>
                <span class="header-span">Pregunta, Qlik responde.</span>
            </div>

            <div class="chat-body" id="chat-body">
                <div class="message assistant">
                    <div class="bubble">
                        <p>Hola, hablemos.</p>
                    </div>
                </div>
            </div>
            <div class="chat-footer">
                <input
                        type="text"
                        id="chat-input"
                        placeholder="Haz tu pregunta aquí..."
                />
                <button id="send-btn">Enviar</button>
            </div>
        </div>
    </article>
</section>
